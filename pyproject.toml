[tool.poetry]
name = "agentes-ventas-reservas"
version = "0.1.0"
description = ""
authors = ["Aldo Abril <aldoabril@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "agents.py" },
    { include = "api_clients.py" },
    { include = "chatbot.py" },
    { include = "main.py" },
    { include = "mcp_client.py" },
    { include = "mcp_server.py" },
    { include = "rag.py" },
    { include = "retriever.py" },
    { include = "tools.py" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0.0"
python-dotenv = ">=1.0.0"
langchain = ">=0.2.0"
langchain-core = ">=1.0.0"
langchain-community = ">=0.2.0"
langchain-openai = ">=0.1.0"
langchain-text-splitters = ">=0.2.0"
langchain-chroma = ">=0.1.0"
chromadb = ">=0.5.0"
langgraph = ">=0.1.0"
pydantic = "<3"
numpy = "*"
openai = "*"
tiktoken = "*"
pypdf = "*"
fastmcp = {version = ">=2.13.1,<3.0.0"}
requests = {version = ">=2.32.5,<3.0.0"}
langchain-google-genai = ">=0.1.0"
load-dotenv = ">=0.1.0"
mcp = {version = ">=1.19.0", extras = ["cli"]}
langsmith = "*"
unstructured = {extras = ["md"], version = "^0.18.21"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
