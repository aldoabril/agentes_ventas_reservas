[project]
name = "agentes-ventas-reservas"
version = "0.1.0"
description = "Sistema multi-agente de IA para gestión de ventas y reservas de citas en consultorios dentales"
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "langgraph>=0.1.0",
    "pydantic<3",
    "numpy",
    "openai",
    "tiktoken",
    "pypdf",
    "fastmcp>=2.13.1,<3.0.0",
    "requests>=2.32.5,<3.0.0",
    "langchain-google-genai>=0.1.0",
    "mcp>=1.19.0",
    "langsmith",
    "unstructured[md]>=0.18.21",
    "python-telegram-bot>=21.0",
]

[tool.poetry]
name = "agentes-ventas-reservas"
version = "0.1.0"
description = ""
authors = ["Aldo Abril <aldoabril@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0.0"
python-dotenv = ">=1.0.0"
langchain = ">=0.2.0"
langchain-core = ">=1.0.0"
langchain-community = ">=0.2.0"
langchain-openai = ">=0.1.0"
langchain-text-splitters = ">=0.2.0"
langchain-chroma = ">=0.1.0"
chromadb = ">=0.5.0"
langgraph = ">=0.1.0"
pydantic = "<3"
numpy = "*"
openai = "*"
tiktoken = "*"
pypdf = "*"
fastmcp = {version = ">=2.13.1,<3.0.0"}
requests = {version = ">=2.32.5,<3.0.0"}
langchain-google-genai = ">=0.1.0"
mcp = {version = ">=1.19.0", extras = ["cli"]}
langsmith = "*"
unstructured = {extras = ["md"], version = "^0.18.21"}
python-telegram-bot = ">=21.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
